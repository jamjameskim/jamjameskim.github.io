<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>무신사머니 포인트 모으기</title>
  <style>
    :root { color-scheme: light; --ink:#161616; --muted:#777b84; --line:#eceef2; --blue:#2868f0; --soft:#f5f6f8; }
    * { box-sizing: border-box; }
    html { background:#eceef2; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
    body { margin:0; color:var(--ink); background:#fff; min-height:100vh; }
    button { font:inherit; color:inherit; }
    .app { width:min(100%, 430px); min-height:100vh; margin:auto; background:#fff; position:relative; overflow:hidden; }
    .status { height:20px; }
    header { height:64px; padding:0 18px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20; background:rgba(255,255,255,.96); backdrop-filter:blur(12px); }
    .icon-btn { width:40px; height:40px; border:0; background:transparent; display:grid; place-items:center; border-radius:50%; cursor:pointer; }
    .icon-btn:active { background:var(--soft); transform:scale(.96); }
    .title { font-size:20px; font-weight:750; letter-spacing:-.04em; }
    main { padding-bottom:40px; }
    .quick { display:flex; gap:10px; padding:8px 16px 22px; overflow-x:auto; scrollbar-width:none; }
    .quick::-webkit-scrollbar,.tabs::-webkit-scrollbar { display:none; }
    .quick button { flex:0 0 78px; border:0; background:transparent; padding:0; cursor:pointer; }
    .quick-card { height:72px; border-radius:10px; background:#f7f7f8; display:grid; place-items:center; font-size:31px; margin-bottom:8px; border:1px solid #f1f1f2; }
    .quick span { font-size:14px; font-weight:650; white-space:nowrap; }
    .benefits { padding:26px 0 28px; background:#f7f7f8; }
    .benefits h2 { margin:0 16px 16px; font-size:23px; line-height:1.3; letter-spacing:-.045em; }
    .benefit-track { display:flex; gap:10px; padding:0 16px 0 32px; scroll-padding-left:32px; overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none; }
    .benefit-track::-webkit-scrollbar { display:none; }
    .benefit-card { flex:0 0 220px; padding:0; overflow:hidden; border:1px solid #eceef1; border-radius:10px; background:#fff; text-align:left; cursor:pointer; scroll-snap-align:start; }
    .benefit-card:active { transform:scale(.985); }
    .benefit-art { height:112px; padding:16px; display:flex; flex-direction:column; justify-content:space-between; color:#fff; }
    .benefit-art.ladder { background:linear-gradient(135deg,#ffb314,#ef653a); }
    .benefit-art.shape { background:linear-gradient(135deg,#ff7ea8,#7356e8); }
    .benefit-art.roulette { background:linear-gradient(135deg,#2d195e,#7a28d6); }
    .benefit-art strong { font-size:23px; line-height:1.05; letter-spacing:-.05em; text-shadow:0 1px 4px rgba(0,0,0,.18); }
    .benefit-art small { align-self:flex-start; padding:3px 6px; border-radius:5px; background:#3778ff; font-size:12px; font-weight:750; }
    .benefit-copy { display:block; padding:13px 14px 15px; }
    .benefit-copy strong,.benefit-copy span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .benefit-copy strong { font-size:17px; letter-spacing:-.03em; }
    .benefit-copy span { margin-top:5px; color:#555a63; font-size:14px; }
    .hero { padding:8px 16px 20px; }
    .hero h1 { font-size:24px; line-height:1.3; letter-spacing:-.045em; margin:0; }
    .tabs { display:flex; gap:8px; padding:0 16px 18px; overflow-x:auto; scrollbar-width:none; position:sticky; top:64px; z-index:15; background:#fff; }
    .tab { flex:0 0 auto; height:42px; padding:0 15px; border:1px solid #d9dce1; border-radius:9px; background:#fff; color:#7d8086; font-size:15px; font-weight:650; cursor:pointer; }
    .tab.active { border:2px solid #171717; color:#171717; font-weight:750; }
    .offers { min-height:480px; }
    .offer { width:100%; padding:14px 16px; border:0; background:#fff; display:grid; grid-template-columns:58px 1fr auto; align-items:center; gap:13px; text-align:left; cursor:pointer; }
    .offer:active { background:#f8f9fa; }
    .thumb { width:58px; height:58px; border:1px solid #e5e7eb; border-radius:10px; display:grid; place-items:center; overflow:hidden; font-weight:850; color:#fff; font-size:17px; letter-spacing:-.04em; }
    .thumb.safe { background:linear-gradient(145deg,#95c4ff,#4a76d8); }
    .thumb.school { background:linear-gradient(145deg,#a3dec7,#1e9e72); }
    .thumb.card { background:linear-gradient(145deg,#fff4a8,#f2bf1a); color:#614600; }
    .thumb.insure { background:linear-gradient(145deg,#c9e1ff,#3375d6); font-size:12px; }
    .thumb.sign { background:linear-gradient(145deg,#ffad5e,#f37222); font-size:12px; }
    .thumb.quiz { background:linear-gradient(145deg,#bd9bff,#693ed6); }
    .copy { min-width:0; }
    .action { display:block; font-size:17px; line-height:1.35; font-weight:750; letter-spacing:-.035em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .partner { display:block; margin-top:5px; color:#868a92; font-size:15px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .reward { padding:7px 10px; background:#f5f5f6; border-radius:999px; font-size:16px; font-weight:750; white-space:nowrap; }
    .empty { padding:64px 24px; text-align:center; color:#858991; }
    .toast { position:fixed; z-index:50; left:50%; bottom:30px; transform:translate(-50%,20px); width:min(calc(100% - 40px),390px); padding:14px 16px; border-radius:12px; background:rgba(26,26,28,.92); color:#fff; font-size:14px; opacity:0; pointer-events:none; transition:.22s ease; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .scrim { position:fixed; inset:0; background:rgba(0,0,0,.36); z-index:30; opacity:0; pointer-events:none; transition:.2s; }
    .scrim.open { opacity:1; pointer-events:auto; }
    .sheet { position:fixed; z-index:40; left:50%; bottom:0; width:min(100%,430px); transform:translate(-50%,105%); background:#fff; border-radius:22px 22px 0 0; padding:10px 20px calc(22px + env(safe-area-inset-bottom)); transition:.3s cubic-bezier(.2,.8,.2,1); box-shadow:0 -12px 40px rgba(0,0,0,.16); }
    .sheet.open { transform:translate(-50%,0); }
    .handle { width:42px; height:5px; background:#d9dadd; border-radius:99px; margin:0 auto 20px; }
    .sheet-head { display:flex; gap:14px; align-items:center; }
    .sheet h2 { margin:0 0 4px; font-size:21px; letter-spacing:-.04em; }
    .sheet p { margin:0; color:#777b83; }
    .condition { margin:22px 0; padding:16px; border-radius:13px; background:#f6f7f9; }
    .condition strong { display:block; font-size:14px; margin-bottom:6px; }
    .condition span { font-size:15px; color:#4d5158; }
    .cta { width:100%; height:52px; border:0; border-radius:12px; background:#111; color:#fff; font-size:17px; font-weight:750; cursor:pointer; }
    .lab { position:fixed; right:max(14px,calc((100vw - 430px)/2 + 14px)); bottom:18px; z-index:22; border:1px solid #dde0e5; background:rgba(255,255,255,.94); box-shadow:0 6px 22px rgba(0,0,0,.12); border-radius:999px; padding:9px 13px; font-size:12px; font-weight:700; cursor:pointer; }
    .lab b { color:var(--blue); }
    @media (min-width:431px) { body { padding:22px 0; } .app { min-height:860px; border-radius:28px; box-shadow:0 20px 70px rgba(20,24,34,.18); } header { top:0; border-radius:28px 28px 0 0; } }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="status"></div>
    <header>
      <button class="icon-btn" aria-label="뒤로 가기" onclick="notify('이전 화면으로 이동합니다')">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="title">무신사머니 포인트 모으기</div>
      <button class="icon-btn" aria-label="홈으로" onclick="notify('홈으로 이동합니다')">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 9-8 9 8v10H3z"/><path d="M9 21v-7h6v7"/></svg>
      </button>
    </header>

    <main>
      <nav class="quick" aria-label="포인트 메뉴">
        <button onclick="notify('럭키박스를 선택했어요')"><div class="quick-card">🎁</div><span>럭키박스</span></button>
        <button onclick="notify('주간미션을 선택했어요')"><div class="quick-card">🚩</div><span>주간미션</span></button>
        <button onclick="notify('행운뽑기를 선택했어요')"><div class="quick-card">🔮</div><span>행운뽑기</span></button>
        <button onclick="notify('적립내역을 선택했어요')"><div class="quick-card">✅</div><span>적립내역</span></button>
      </nav>

      <section class="benefits" aria-labelledby="benefitTitle">
        <h2 id="benefitTitle">지금 받을 수 있는 무신사 혜택</h2>
        <div class="benefit-track">
          <button class="benefit-card" onclick="notify('황금 사다리를 선택했어요')">
            <span class="benefit-art ladder"><small>1원부터</small><strong>행운의<br>황금 사다리</strong></span>
            <span class="benefit-copy"><strong>황금 사다리</strong><span>사다리만 타면 무조건 당첨</span></span>
          </button>
          <button class="benefit-card" onclick="notify('선 긋기 챌린지를 선택했어요')">
            <span class="benefit-art shape"><small>1원부터</small><strong>선 긋기<br>챌린지</strong></span>
            <span class="benefit-copy"><strong>따라 긋기만 하면 끝!</strong><span>손가락 하나로 모형을 완성해요</span></span>
          </button>
          <button class="benefit-card" onclick="notify('테이블 룰렛을 선택했어요')">
            <span class="benefit-art roulette"><small>1원부터</small><strong>테이블<br>룰렛</strong></span>
            <span class="benefit-copy"><strong>테이블 룰렛</strong><span>룰렛 한 번에 최대 포인트</span></span>
          </button>
        </div>
      </section>

      <section class="hero"><h1>참여하고 무신사머니 포인트 받기</h1></section>
      <nav class="tabs" id="tabs" aria-label="혜택 분류"></nav>
      <section class="offers" id="offers" aria-live="polite"></section>
    </main>
  </div>

  <button class="lab" id="lab" aria-label="라벨 버전 전환">라벨: <b>개선안</b></button>
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="handle"></div>
    <div class="sheet-head">
      <div class="thumb" id="sheetThumb"></div>
      <div><h2 id="sheetTitle"></h2><p id="sheetPartner"></p></div>
    </div>
    <div class="condition"><strong>포인트 적립 조건</strong><span id="sheetCondition"></span></div>
    <button class="cta" id="join">미션 참여하기</button>
  </aside>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const tabs=['많이 받기','구독하기','게임하기','장소찾기','AI 추천','1분 컷','쇼핑'];
    const offers={
      '많이 받기':[
        {icon:'S',tone:'safe',old:'미션 참여하면',action:'안전결제 이용하기',partner:'스마트안전결제',reward:'1,080원',condition:'안전결제를 처음 이용하면 포인트가 지급돼요.'},
        {icon:'☂',tone:'school',old:'미션 참여하면',action:'학교에 송금하기',partner:'950원으로 학교 보내기',reward:'360원',condition:'송금을 완료하면 포인트가 지급돼요.'},
        {icon:'KB',tone:'card',old:'미션 참여하면',action:'체크카드 발급받기',partner:'KB국민카드',reward:'7,200원',condition:'체크카드를 발급받으면 포인트가 지급돼요.'},
        {icon:'삼성',tone:'insure',old:'미션 참여하면',action:'자동차보험료 조회하기',partner:'삼성화재 다이렉트',reward:'4,400원',condition:'자동차보험료 조회를 완료하면 포인트가 지급돼요.'},
        {icon:'SIGN',tone:'sign',old:'미션 참여하면',action:'회원가입 완료하기',partner:'스마트사인',reward:'500원',condition:'신규 회원가입을 완료하면 포인트가 지급돼요.'},
        {icon:'Q',tone:'quiz',old:'미션 참여하면',action:'오늘의 퀴즈 맞히기',partner:'데일리 퀴즈',reward:'10원',condition:'퀴즈의 정답을 맞히면 포인트가 지급돼요.'}
      ],
      '구독하기':[{icon:'▶',tone:'quiz',action:'첫 달 구독 시작하기',partner:'콘텐츠 플러스',reward:'2,000원',condition:'첫 달 구독을 시작하면 포인트가 지급돼요.'}],
      '게임하기':[{icon:'🎮',tone:'school',action:'게임 레벨 10 달성하기',partner:'퍼즐 어드벤처',reward:'3,600원',condition:'설치 후 레벨 10을 달성하면 포인트가 지급돼요.'}],
      '장소찾기':[{icon:'⌖',tone:'safe',action:'우리 동네 장소 저장하기',partner:'플레이스 픽',reward:'100원',condition:'장소를 저장하면 포인트가 지급돼요.'}],
      'AI 추천':[{icon:'AI',tone:'card',action:'추천 미션 확인하기',partner:'나를 위한 혜택',reward:'최대 8천원',condition:'추천된 미션의 조건을 달성하면 포인트가 지급돼요.'}],
      '1분 컷':[{icon:'1′',tone:'sign',action:'간단 설문 완료하기',partner:'오늘의 설문',reward:'80원',condition:'1분 설문을 제출하면 포인트가 지급돼요.'}],
      '쇼핑':[{icon:'🛍',tone:'quiz',action:'상품 구매하기',partner:'브랜드 쇼핑',reward:'구매액 2%',condition:'상품 구매를 완료하면 포인트가 지급돼요.'}]
    };
    let active='많이 받기', improved=true, selected=null;
    const tabsEl=document.querySelector('#tabs'), offersEl=document.querySelector('#offers');

    function renderTabs(){
      tabsEl.innerHTML=tabs.map(t=>`<button class="tab ${t===active?'active':''}" data-tab="${t}">${t}</button>`).join('');
      tabsEl.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{active=btn.dataset.tab; renderTabs(); renderOffers(); btn.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});});
    }
    function renderOffers(){
      const list=offers[active]||[];
      offersEl.innerHTML=list.length?list.map((o,i)=>`<button class="offer" data-index="${i}" aria-label="${o.action}, ${o.reward}">
        <span class="thumb ${o.tone}">${o.icon}</span>
        <span class="copy"><span class="action">${active==='많이 받기'&&!improved?o.old:o.action}</span><span class="partner">${o.partner}</span></span>
        <span class="reward">${o.reward}</span>
      </button>`).join(''):'<div class="empty">준비 중인 혜택이에요.</div>';
      offersEl.querySelectorAll('.offer').forEach(btn=>btn.onclick=()=>openOffer(list[+btn.dataset.index]));
    }
    function openOffer(o){
      selected=o;
      const thumb=document.querySelector('#sheetThumb'); thumb.className=`thumb ${o.tone}`; thumb.textContent=o.icon;
      document.querySelector('#sheetTitle').textContent=o.action;
      document.querySelector('#sheetPartner').textContent=`${o.partner} · ${o.reward}`;
      document.querySelector('#sheetCondition').textContent=o.condition;
      document.querySelector('#scrim').classList.add('open'); document.querySelector('#sheet').classList.add('open');
    }
    function closeSheet(){document.querySelector('#scrim').classList.remove('open'); document.querySelector('#sheet').classList.remove('open');}
    function notify(message){const t=document.querySelector('#toast');t.textContent=message;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}
    document.querySelector('#scrim').onclick=closeSheet;
    document.querySelector('#join').onclick=()=>{closeSheet();notify(`${selected.partner} 미션을 시작합니다`);};
    document.querySelector('#lab').onclick=()=>{improved=!improved;document.querySelector('#lab').innerHTML=`라벨: <b>${improved?'개선안':'기존안'}</b>`;renderOffers();notify(improved?'행동 중심 라벨을 적용했어요':'기존 라벨로 전환했어요');};
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
    renderTabs(); renderOffers();
  </script>
</body>
</html>
